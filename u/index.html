<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find me on Cravely</title>
<meta name="description" content="Someone invited you to Cravely, the social food app. Follow what they eat, find hidden spots and share your own plates.">
<meta property="og:title" content="Come eat with me on Cravely">
<meta property="og:description" content="Follow what I eat, find hidden food spots and share your own plates.">
<meta property="og:image" content="https://getcravely.co.uk/art/og.jpg">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Geist:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../site.css?v=3">
<style>
  .invite{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:110px 16px 48px}
  .inv-card{width:min(440px,100%);background:#fff;border-radius:32px;box-shadow:0 40px 90px -30px rgba(76,29,149,.45),0 0 0 1px rgba(124,58,237,.08);overflow:hidden;text-align:center}
  .inv-art{position:relative;height:230px;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#EDE7FF,#DCD1FB)}
  .inv-art .chef{position:absolute;left:50%;bottom:-6px;height:212px;width:auto;transform:translateX(-50%);filter:drop-shadow(0 14px 18px rgba(76,29,149,.25));}
  .inv-art .p{position:absolute;width:62px;height:62px;border-radius:50%;object-fit:cover;background:#F3EEFF;border:4px solid #fff;box-shadow:0 10px 24px -8px rgba(76,29,149,.5)}
  .inv-art .p1{left:12%;top:26%;animation:bob 3.4s ease-in-out infinite}.inv-art .p2{right:12%;top:18%;animation:bob 3.8s ease-in-out -1s infinite}
  @keyframes bob{50%{transform:translateY(-7px)}}
  .inv-body{padding:26px 26px 30px}
  .inv-body h1{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:30px;letter-spacing:-.01em;margin:0 0 6px;color:#1E1240}
  .inv-handle{display:inline-block;margin:0 0 12px;padding:4px 14px;border-radius:99px;background:#F1ECFF;color:#5B21B6;font-weight:600;font-size:17px}
  .inv-body p{color:#5B5675;line-height:1.6;margin:0 0 20px}
  .inv-btns{display:grid;gap:10px}
  .inv-btns .btn{justify-content:center;width:100%}
  .btn-ghost{background:#F1ECFF;color:#5B21B6}
  .inv-steps{text-align:left;margin:22px 0 0;padding:16px 18px;border-radius:18px;background:#FAF8FF;color:#3F3A5A;font-size:14.5px;line-height:1.6}
  .inv-steps b{color:#1E1240}
  @media (prefers-reduced-motion:reduce){.inv-art *{animation:none!important}}
</style>
</head>
<body>
<header class="nav scrolled" id="nav">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Cravely home"><img class="mark" src="../icon.svg" alt=""><img class="word" src="../wordmark.svg" alt="cravely"></a>
    <a class="btn btn-primary btn-sm" href="/">About Cravely</a>
  </div>
</header>
<main class="invite">
  <div class="inv-card">
    <div class="inv-art" aria-hidden="true">
      <img class="p p1" src="../art/heads/noodle.webp" alt=""><img class="p p2" src="../art/heads/taco.webp" alt="">
      <img class="chef" id="chef" src="../art/chefs/chompy.webp" alt="">
    </div>
    <div class="inv-body">
      <h1 id="title">You're invited to Cravely</h1>
      <div class="inv-handle" id="handle" hidden></div>
      <p id="lead">Share what you eat, and see where your friends are eating.</p>
      <div class="inv-btns">
        <a class="btn btn-primary" id="get" href="/#tester">Get Cravely for Android</a>
        <button class="btn btn-ghost" id="copy" type="button" hidden>Copy username</button>
      </div>
      <div class="inv-steps" id="steps" hidden>
        <b>Already have Cravely?</b> Search for <b id="h2"></b> and tap Follow.
      </div>
    </div>
  </div>
</main>
<script>
(function () {
  var chefs = ['bao','blaze','boba','butters','chompy','gulp','maki','noodle','pepperoni','scoop','sizzle','sprinkle','taco','whisky'];
  var q = new URLSearchParams(location.search), h = (q.get('h') || '').toLowerCase().replace(/[^a-z0-9._]/g, '').slice(0, 20);
  var sum = 0; for (var i = 0; i < h.length; i++) sum += h.charCodeAt(i);
  document.getElementById('chef').src = '../art/chefs/' + chefs[h ? sum % chefs.length : 4] + '.webp';
  if (!h) return;
  document.title = '@' + h + ' is on Cravely';
  document.getElementById('title').textContent = 'Come eat with me';
  var hd = document.getElementById('handle'); hd.textContent = '@' + h; hd.hidden = false;
  document.getElementById('lead').textContent = 'Follow @' + h + ' to see what they\'re eating.';
  document.getElementById('h2').textContent = '@' + h; document.getElementById('steps').hidden = false;
  var c = document.getElementById('copy'); c.hidden = false;
  c.addEventListener('click', function () { (navigator.clipboard ? navigator.clipboard.writeText('@' + h) : Promise.reject()).then(function () { c.textContent = 'Copied @' + h; }, function () { c.textContent = '@' + h; }); });
})();
</script>
</body>
</html>
